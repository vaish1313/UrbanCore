[tool.poetry]
name = "urbancore-backend"
version = "0.1.0"
description = "UrbanCore FastAPI Backend"
authors = ["UrbanCore Engineering"]
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "ai" },
    { include = "geospatial" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.29"
psycopg2-binary = "^2.9.9"
geoalchemy2 = "^0.14.6"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
celery = "^5.3.6"
redis = "^5.0.3"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
shapely = "^2.0.3"
geopandas = "^0.14.3"
rasterio = "^1.3.9"
pyproj = "^3.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
ruff = "^0.3.5"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true
