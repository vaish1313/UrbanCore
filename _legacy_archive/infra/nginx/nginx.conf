# ============================================================
# UrbanCore — Nginx Reverse Proxy Configuration
# Handles: TLS termination, routing, WebSocket upgrade, compression
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       application/geo+json image/svg+xml;
    gzip_min_length    1024;

    # ─── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options           DENY                        always;
    add_header X-Content-Type-Options    nosniff                     always;
    add_header X-XSS-Protection          "1; mode=block"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=()"  always;
    server_tokens off;

    # ─── Rate Limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=1r/s;

    # ─── Upstreams ────────────────────────────────────────────
    upstream gateway {
        server gateway:3000;
        keepalive 32;
    }

    upstream ui {
        server ui:80;
        keepalive 16;
    }

    upstream martin {
        server martin:3000;
        keepalive 16;
    }

    # ─── HTTP → HTTPS Redirect (uncomment for production TLS) ─
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ─── Main Server Block ────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl http2;    # Uncomment for TLS
        server_name _;

        # TLS (uncomment for production):
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        client_max_body_size 500M;  # Large GIS file uploads

        # ─── API Gateway ──────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 300s;
        }

        # ─── WebSocket (job progress updates) ─────────────────
        location /ws/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;  # Long-running WebSocket connections
        }

        # ─── Martin Vector Tiles ──────────────────────────────
        location /tiles/ {
            proxy_pass       http://martin/;
            proxy_set_header Host $host;
            proxy_cache_valid 200 10m;     # Cache tiles for 10 minutes
            add_header       Cache-Control "public, max-age=600";
        }

        # ─── File Uploads (GIS files) ─────────────────────────
        location /api/v1/upload/ {
            limit_req zone=uploads burst=5 nodelay;
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_request_buffering off;   # Stream large uploads
            proxy_read_timeout 600s;
        }

        # ─── React SPA (everything else) ──────────────────────
        location / {
            proxy_pass         http://ui;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
