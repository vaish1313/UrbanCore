[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbancore-gis-service"
version = "0.1.0"
description = "UrbanCore GIS Service — Terrain analysis, compliance, OSM integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "geoalchemy2>=0.14.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "rasterio>=1.3.9",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "geopandas>=0.14.3",
    "scipy>=1.12.0",
    "GDAL>=3.6.0",
    "fiona>=1.9.5",
    "minio>=7.2.3",
    "httpx>=0.26.0",
    "urbancore-shared @ file:///${PROJECT_ROOT}/../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.3",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
