[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbancore-intelligence-service"
version = "0.1.0"
description = "UrbanCore Intelligence Service — RAG, LLM, report generation, semantic search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "httpx>=0.26.0",
    "minio>=7.2.3",
    "jinja2>=3.1.3",         # Report templating
    "weasyprint>=61.0",      # PDF generation
    "tiktoken>=0.6.0",       # Token counting for LLM cost tracking
    "numpy>=1.26.0",
    "urbancore-shared @ file:///${PROJECT_ROOT}/../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.3",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
