[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbancore-ai-service"
version = "0.1.0"
description = "UrbanCore AI Service — U-Net inference, SAM refinement, change detection"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "geoalchemy2>=0.14.0",
    # Task queue
    "celery>=5.3.6",
    "redis>=5.0.1",
    "watchdog>=3.0.0",        # For dev auto-restart
    # Geospatial
    "rasterio>=1.3.9",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "geopandas>=0.14.3",
    "scipy>=1.12.0",
    # Object storage
    "minio>=7.2.3",
    # Shared package (installed as local dependency)
    "urbancore-shared @ file:///${PROJECT_ROOT}/../shared",
    # HTTP client (for publishing events)
    "httpx>=0.26.0",
]

[project.optional-dependencies]
ml = [
    # PyTorch — installed separately due to CUDA variant requirements
    # Run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
    "segmentation-models-pytorch>=0.3.3",
    "segment-anything>=1.0",
    "torchvision>=0.17.0",
    "albumentations>=1.3.1",    # Image augmentation for preprocessing
    "pillow>=10.2.0",
    "timm>=0.9.12",              # PyTorch image models (ResNet-34 backbone)
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",            # For FastAPI TestClient
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "watchdog>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
