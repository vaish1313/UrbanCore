# A generic, single database configuration.
# URL is intentionally left blank — env.py reads it from our Settings singleton.
[alembic]
script_location = backend/app/db/migrations

# Template string for generated revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file naming
timezone = UTC

# Truncate long migration messages in filenames
truncate_slug_length = 40

# Suppress SQLAlchemy 2.0 deprecation warnings during migration generation
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
