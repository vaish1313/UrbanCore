version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: urbancore-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbancore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-urbancore}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: urbancore-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: 
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: urbancore-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-urbancore}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-urbancore}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=dev
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  celery_worker:
    build: 
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: urbancore-celery
    command: celery -A backend.app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-urbancore}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-urbancore}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: urbancore-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
